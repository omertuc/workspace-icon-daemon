[package]
name = "workspace-icon-daemon"
version = "0.2.0"
edition = "2024"
description = "Dynamic application icons in i3 and Sway workspace names"
license = "MIT"
authors = ["David Ott"]
repository = "https://github.com/David0tt/workspace-icon-daemon"
keywords = ["i3", "sway", "workspace", "icons", "font"]
default-run = "workspace-icon-daemon"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
env_logger = "0.11.11"
image = { version = "0.25.10", default-features = false, features = ["png", "ico", "jpeg", "gif", "webp", "bmp"] }
log = "0.4.34"
read-fonts = "0.45.0"
regex = "1.13.1"
resvg = "0.48.1"
roxmltree = "0.21.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
signal-hook = "0.4.5"
tempfile = "3.27.0"
zbus = { version = "5.19.0", default-features = false, features = ["blocking-api", "async-io"] }

[profile.release]
strip = true
lto = "thin"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
must_use_candidate = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
